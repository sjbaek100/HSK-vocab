<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HSK 단어장">
<meta name="theme-color" content="#E7EDE4">
<title>HSK 단어장</title>
<style>
/* ---- tokens ---- */
:root{
  --bg:#E7EDE4;
  --paper:#FBFAF6;
  --paper-2:#F1EFE6;
  --ink:#22261F;
  --ink-soft:#5C6B5E;
  --ink-faint:#8A9A8E;
  --seal:#B7231A;
  --seal-dark:#8E1B14;
  --jade:#4C7A5A;
  --jade-soft:#DCE7DD;
  --border:#D7DED2;
  --gold:#AD8A3E;
  --shadow: 0 1px 2px rgba(34,38,31,0.06), 0 6px 20px rgba(34,38,31,0.08);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(1200px 800px at 50% -10%, #EEF2EA 0%, var(--bg) 55%);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  min-height:100vh;
  -webkit-tap-highlight-color: transparent;
}
#app{
  max-width:480px;
  margin:0 auto;
  min-height:100vh;
  padding:20px 18px 40px;
  position:relative;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
button:disabled{opacity:0.35;cursor:default;}

/* ---- home ---- */
.hero{text-align:center;padding:18px 0 26px;}
.hero-seal{
  width:56px;height:56px;margin:0 auto 12px;
  border:2px solid var(--seal);
  border-radius:8px;
  color:var(--seal);
  display:flex;align-items:center;justify-content:center;
  font-family:"STKaiti","Kaiti SC","KaiTi","Songti SC",serif;
  font-size:30px;
  transform:rotate(-3deg);
}
.hero h1{
  margin:0 0 6px;
  font-family:"Songti SC","Noto Serif SC","STSong",serif;
  font-size:26px;
  letter-spacing:0.02em;
}
.hero .sub{margin:0;color:var(--ink-soft);font-size:13px;}

.level-list{display:flex;flex-direction:column;gap:10px;}
.level-card{
  display:flex;align-items:center;gap:14px;
  background:var(--paper);
  border:1px solid var(--border);
  border-radius:14px;
  padding:14px;
  box-shadow:var(--shadow);
  text-align:left;
  transition:transform .15s ease;
}
.level-card:active{transform:scale(0.98);}
.stamp{
  flex:0 0 auto;
  width:44px;height:44px;
  border-radius:8px;
  border:1.5px solid var(--seal);
  color:var(--seal);
  display:flex;align-items:center;justify-content:center;
  font-family:"STKaiti","Kaiti SC","KaiTi",serif;
  font-size:20px;font-weight:600;
}
.level-info{flex:1 1 auto;min-width:0;}
.level-title{font-weight:600;font-size:15px;}
.level-meta{font-size:12px;color:var(--ink-soft);margin:2px 0 6px;}
.bar{height:5px;border-radius:3px;background:var(--paper-2);overflow:hidden;}
.bar-fill{height:100%;background:var(--jade);border-radius:3px;}
.chevron{color:var(--ink-faint);font-size:20px;}

/* ---- topbar / shared ---- */
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.back{font-size:14px;color:var(--seal);font-weight:600;padding:6px 2px;}
.topbar-title{font-size:14px;color:var(--ink-soft);font-weight:600;}

.level-summary{text-align:center;margin:6px 0 20px;}
.level-summary-num{display:inline;font-size:28px;font-weight:700;color:var(--seal);font-family:"Songti SC","Noto Serif SC",serif;}
.level-summary-total{display:inline;font-size:14px;color:var(--ink-soft);}

.section-label{font-size:12px;color:var(--ink-faint);margin:18px 0 8px;letter-spacing:.03em;}
.scope-row{display:flex;gap:8px;}
.scope-btn{
  flex:1;padding:10px 8px;border-radius:10px;
  background:var(--paper);border:1px solid var(--border);
  font-size:13px;color:var(--ink-soft);
}
.scope-btn.active{background:var(--jade-soft);border-color:var(--jade);color:var(--jade);font-weight:600;}

.action-row{display:flex;flex-direction:column;gap:10px;}
.action-btn{
  display:flex;align-items:center;gap:12px;
  padding:16px;border-radius:14px;
  background:var(--paper);border:1px solid var(--border);
  box-shadow:var(--shadow);
  font-size:15px;font-weight:600;
}
.action-btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.action-icon{font-size:20px;}

/* ---- flashcards ---- */
.card-area{display:flex;justify-content:center;padding:10px 0 22px;perspective:1200px;}
.flashcard{
  position:relative;
  width:100%;max-width:340px;height:400px;
  cursor:pointer;
  transform-style:preserve-3d;
  transition:transform .5s cubic-bezier(.4,.2,.2,1);
}
.flashcard.flipped{transform:rotateY(180deg);}
.card-face{
  position:absolute;inset:0;
  border-radius:20px;
  background:var(--paper);
  border:1px solid var(--border);
  box-shadow:var(--shadow);
  backface-visibility:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;text-align:center;
}
.card-back{transform:rotateY(180deg);justify-content:flex-start;padding-top:60px;}
.hanzi{
  font-family:"STKaiti","Kaiti SC","KaiTi","Songti SC",serif;
  font-size:76px;line-height:1.1;color:var(--ink);
}
.pinyin{font-size:18px;color:var(--seal);margin-top:10px;font-weight:600;}
.tap-hint{position:absolute;bottom:20px;font-size:11px;color:var(--ink-faint);}
.pos-tag{
  font-size:11px;color:var(--jade);background:var(--jade-soft);
  padding:3px 10px;border-radius:20px;margin-bottom:14px;
}
.meaning{font-size:22px;font-weight:700;color:var(--ink);margin-bottom:16px;padding:0 8px;}
.example{font-size:13px;color:var(--ink-soft);line-height:1.7;padding:0 12px;}

.stamp-mark{
  position:absolute;top:16px;right:16px;
  width:64px;height:64px;border-radius:8px;
  border:3px solid var(--seal);color:var(--seal);
  display:flex;align-items:center;justify-content:center;
  font-family:"STKaiti","Kaiti SC","KaiTi",serif;font-size:26px;font-weight:700;
  transform:rotate(-8deg) scale(1.4);opacity:0;
  animation:stampIn .5s ease-out forwards;
  pointer-events:none;
  z-index:5;
}
.stamp-mark.unknow{border-color:var(--ink-faint);color:var(--ink-faint);}
@keyframes stampIn{
  0%{opacity:0;transform:rotate(-8deg) scale(2.2);}
  60%{opacity:1;transform:rotate(-8deg) scale(0.95);}
  100%{opacity:1;transform:rotate(-8deg) scale(1);}
}

.nav-row{display:flex;gap:10px;margin-bottom:10px;}
.nav-btn{
  flex:1;padding:12px;border-radius:12px;
  background:var(--paper);border:1px solid var(--border);
  font-size:14px;color:var(--ink-soft);font-weight:600;
}
.nav-btn.full{width:100%;background:var(--ink);color:var(--paper);border-color:var(--ink);margin-top:8px;}

.mark-row{display:flex;gap:10px;margin-top:6px;}
.mark-btn{
  flex:1;padding:14px;border-radius:12px;font-size:14px;font-weight:700;
  box-shadow:var(--shadow);
}
.mark-btn.unknow{background:var(--paper);color:var(--ink-soft);border:1px solid var(--border);}
.mark-btn.know{background:var(--seal);color:#fff;}

/* ---- quiz ---- */
.quiz-q{text-align:center;padding:30px 10px 26px;}
.quiz-hanzi{font-family:"STKaiti","Kaiti SC","KaiTi","Songti SC",serif;font-size:64px;color:var(--ink);}
.quiz-pinyin{font-size:16px;color:var(--seal);font-weight:600;margin-top:8px;}
.quiz-meaning-q{font-size:26px;font-weight:700;color:var(--ink);padding:0 10px;line-height:1.4;}
.quiz-choices{display:flex;flex-direction:column;gap:10px;}
.quiz-choice{
  padding:14px 16px;border-radius:12px;text-align:left;
  background:var(--paper);border:1px solid var(--border);
  font-size:15px;box-shadow:var(--shadow);
  display:flex;align-items:baseline;gap:10px;
}
.quiz-choice .choice-hanzi{font-family:"STKaiti","Kaiti SC","KaiTi","Songti SC",serif;font-size:22px;}
.quiz-choice .choice-pinyin{font-size:12px;color:var(--seal);}
.quiz-choice.correct{background:var(--jade-soft);border-color:var(--jade);color:var(--jade);font-weight:700;}
.quiz-choice.wrong{background:#F5DEDB;border-color:var(--seal);color:var(--seal-dark);font-weight:700;}

.result-box{text-align:center;padding:40px 10px;}
.result-seal{
  width:120px;height:120px;margin:0 auto 18px;
  border:3px solid var(--seal);border-radius:16px;color:var(--seal);
  display:flex;align-items:center;justify-content:center;
  font-family:"Songti SC","Noto Serif SC",serif;font-size:30px;font-weight:700;
  transform:rotate(-3deg);
}
.result-text{font-size:16px;color:var(--ink-soft);}

.notice{
  margin-top:16px;padding:12px 14px;border-radius:10px;
  background:var(--paper-2);color:var(--ink-soft);font-size:12px;line-height:1.6;
  border:1px solid var(--border);
}

/* ---- speaker button on flashcard ---- */
.card-area{position:relative;}
.speaker-btn{
  position:absolute;top:8px;right:calc(50% - 170px);
  width:38px;height:38px;border-radius:50%;
  background:var(--paper);border:1px solid var(--border);
  box-shadow:var(--shadow);font-size:16px;
  display:flex;align-items:center;justify-content:center;
  z-index:6;
}
@media (max-width:420px){
  .speaker-btn{right:14px;}
}

/* ---- list (spreadsheet) view ---- */
.search-box{
  width:100%;padding:12px 14px;border-radius:12px;
  background:var(--paper);border:1px solid var(--border);
  font-size:14px;margin-bottom:12px;color:var(--ink);
}
.search-box::placeholder{color:var(--ink-faint);}
.list-head,.list-row{
  display:grid;
  grid-template-columns:24px 1.1fr 0.95fr 1.3fr 34px;
  gap:6px;align-items:center;
}
.list-head{
  padding:0 10px 8px;
  font-size:11px;color:var(--ink-faint);letter-spacing:.03em;
  border-bottom:1px solid var(--border);
}
.list-rows{max-height:calc(100vh - 210px);overflow-y:auto;-webkit-overflow-scrolling:touch;}
.list-rows.result-rows{max-height:340px;margin-top:8px;}
.list-row{
  padding:9px 10px;border-bottom:1px solid var(--border);
  font-size:13.5px;background:var(--paper);
}
.list-row.mastered{background:var(--jade-soft);}
.list-row .col-word.speak-word{
  text-align:left;font-family:"STKaiti","Kaiti SC","KaiTi","Songti SC",serif;
  font-size:17px;color:var(--ink);
}
.list-row .col-word.speak-word:active{color:var(--seal);}
.list-row .col-pinyin{color:var(--seal);font-size:12px;}
.list-row .col-meaning{color:var(--ink-soft);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.list-row .col-idx{color:var(--ink-faint);font-size:11px;}
.col-check{
  width:30px;height:30px;border-radius:50%;
  border:1.5px solid var(--border);color:var(--ink-faint);
  font-size:14px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
}
.col-check.checked{background:var(--jade);border-color:var(--jade);color:#fff;}
.list-empty{padding:30px 10px;text-align:center;color:var(--ink-faint);font-size:13px;}

/* ---- listen mode ---- */
.listen-box{
  text-align:center;padding:40px 16px;margin-bottom:10px;
  background:var(--paper);border:1px solid var(--border);border-radius:20px;
  box-shadow:var(--shadow);
}
.listen-badge{
  display:inline-block;font-size:12px;color:var(--seal);
  background:var(--jade-soft);padding:4px 12px;border-radius:20px;margin-bottom:18px;
}
.listen-meaning{margin-top:18px;color:var(--ink-soft);font-size:20px;font-weight:600;}

@media (max-width:360px){
  .hanzi{font-size:64px;}
  .flashcard{height:360px;}
}

</style>
</head>

<script>
/* HSK 단어장 — app logic */
(function () {
  'use strict';

  var LEVELS = Object.keys(DATA); // ["HSK 1급", ...]

  var STORAGE_KEY = 'hsk_progress_v1';
  var progress = {}; // { "HSK 1급-0": true, ... }
  var storageOK = true;

  function loadProgress() {
    try {
      var raw = window.localStorage.getItem(STORAGE_KEY);
      if (raw) {
        progress = JSON.parse(raw);
        return;
      }
    } catch (e) {
      storageOK = false;
    }
    // first run: seed from '상태' column (완벽 = mastered)
    LEVELS.forEach(function (level) {
      DATA[level].forEach(function (row, idx) {
        if (row['상태'] && row['상태'].trim() === '완벽') {
          progress[level + '-' + idx] = true;
        }
      });
    });
    saveProgress();
  }

  function saveProgress() {
    try {
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
    } catch (e) {
      storageOK = false;
    }
  }

  function isMastered(level, idx) {
    return !!progress[level + '-' + idx];
  }

  function setMastered(level, idx, val) {
    var key = level + '-' + idx;
    if (val) progress[key] = true; else delete progress[key];
    saveProgress();
  }

  function masteredCount(level) {
    var n = 0;
    DATA[level].forEach(function (_, idx) {
      if (isMastered(level, idx)) n++;
    });
    return n;
  }

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  // ---------- speech (TTS) ----------
  var speechOK = !!(window.speechSynthesis && window.SpeechSynthesisUtterance);
  var speechToken = 0; // bumped on every intentional interrupt, invalidates in-flight callbacks
  var voiceList = [];
  var noZhVoiceWarned = false;

  function refreshVoices() {
    if (!speechOK) return;
    var v = window.speechSynthesis.getVoices();
    if (v && v.length) voiceList = v;
  }
  if (speechOK) {
    refreshVoices();
    window.speechSynthesis.onvoiceschanged = refreshVoices;
  }

  function pickVoice(langPrefix) {
    if (!voiceList.length) refreshVoices();
    if (!voiceList.length) return null;
    var lower = langPrefix.toLowerCase();
    var base = lower.split('-')[0];
    var exact = null, partial = null;
    for (var i = 0; i < voiceList.length; i++) {
      var vl = (voiceList[i].lang || '').toLowerCase();
      if (vl === lower) { exact = voiceList[i]; break; }
      if (!partial && vl.indexOf(base) === 0) partial = voiceList[i];
    }
    return exact || partial;
  }

  function hasZhVoice() {
    return !!pickVoice('zh-CN');
  }

  function speakOne(text, lang, rate, onend) {
    if (!speechOK || !text) { if (onend) onend(); return; }
    var u = new SpeechSynthesisUtterance(text);
    u.lang = lang;
    var v = pickVoice(lang);
    if (v) u.voice = v;
    u.rate = rate || 1;
    u.onend = onend || null;
    u.onerror = onend || null;
    window.speechSynthesis.speak(u);
  }

  function speakWordThenMeaning(row, onend) {
    if (!speechOK) { if (onend) onend(); return; }
    var myToken = ++speechToken;
    window.speechSynthesis.cancel();
    // small delay: speaking immediately after cancel() clips the start of
    // the next utterance on many mobile browsers
    setTimeout(function () {
      if (myToken !== speechToken) return;
      speakOne(row['단어'], 'zh-CN', 0.85, function () {
        if (myToken !== speechToken) return;
        setTimeout(function () {
          if (myToken !== speechToken) return;
          speakOne(row['뜻'], 'en-US', 0.95, function () {
            if (myToken !== speechToken) return;
            if (onend) onend();
          });
        }, 180);
      });
    }, 80);
  }

  function stopSpeech() {
    speechToken++; // invalidate any callbacks still in flight from a previous chain
    if (speechOK) window.speechSynthesis.cancel();
  }

  function speakWordOnly(row, onend) {
    if (!speechOK) { if (onend) onend(); return; }
    var myToken = ++speechToken;
    window.speechSynthesis.cancel();
    setTimeout(function () {
      if (myToken !== speechToken) return;
      speakOne(row['단어'], 'zh-CN', 0.85, function () {
        if (myToken !== speechToken) return;
        if (onend) onend();
      });
    }, 80);
  }

  var currentLevel = null;
  var filterMode = 'all'; // all | unmastered
  var deck = []; // array of {idx, ...row}
  var cardIndex = 0;
  var flipped = false;
  var pinyinShown = false;
  var stampAnim = null;

  var quizQueue = [];
  var quizIndex = 0;
  var quizScore = 0;
  var quizWrong = [];
  var quizAnswered = false;
  var quizChoices = [];
  var quizSelected = -1;
  var quizDirection = 'zh2en'; // zh2en | en2zh
  var quizAdvanceTimer = null;

  var listSearch = '';

  var listenDeck = [];
  var listenIndex = 0;
  var listenPlaying = false;

  var root = document.getElementById('app');

  function buildDeck(level, mode) {
    var items = DATA[level].map(function (row, idx) { return { idx: idx, row: row }; });
    if (mode === 'unmastered') {
      items = items.filter(function (it) { return !isMastered(level, it.idx); });
    }
    return shuffle(items);
  }

  function go(v) {
    stopSpeech();
    listenPlaying = false;
    if (quizAdvanceTimer) { clearTimeout(quizAdvanceTimer); quizAdvanceTimer = null; }
    view = v;
    render();
    window.scrollTo(0, 0);
  }

  function openLevel(level) {
    currentLevel = level;
    go('level');
  }

  function startFlashcards(mode) {
    filterMode = mode;
    deck = buildDeck(currentLevel, mode);
    cardIndex = 0;
    flipped = false;
    pinyinShown = false;
    if (deck.length === 0) { go('level'); return; }
    go('flashcards');
  }

  function startQuiz(mode) {
    filterMode = mode;
    var d = buildDeck(currentLevel, mode);
    quizQueue = d.slice(0, Math.min(20, d.length));
    quizIndex = 0;
    quizScore = 0;
    quizWrong = [];
    if (quizQueue.length < 4) { go('level'); return; }
    prepQuizQuestion();
    go('quiz');
  }

  function retryWrong() {
    quizQueue = quizWrong.slice();
    quizIndex = 0;
    quizScore = 0;
    quizWrong = [];
    if (quizQueue.length === 0) { go('level'); return; }
    prepQuizQuestion();
    go('quiz');
  }

  function prepQuizQuestion() {
    quizAnswered = false;
    quizSelected = -1;
    quizDirection = Math.random() < 0.5 ? 'zh2en' : 'en2zh';
    var pool = DATA[currentLevel];
    var correct = quizQueue[quizIndex];
    var distractorPool = pool
      .map(function (row, idx) { return { idx: idx, row: row }; })
      .filter(function (it) { return it.idx !== correct.idx && it.row['뜻'] && it.row['뜻'].trim(); });
    var distractors = shuffle(distractorPool).slice(0, 3);
    var options = [correct].concat(distractors);
    quizChoices = shuffle(options);
  }

  function answerQuiz(choiceIdx) {
    if (quizAnswered) return;
    quizAnswered = true;
    quizSelected = choiceIdx;
    var correct = quizQueue[quizIndex];
    var picked = quizChoices[choiceIdx];
    if (picked.idx === correct.idx) {
      quizScore++;
    } else {
      quizWrong.push(correct);
    }
    render();
    if (quizAdvanceTimer) clearTimeout(quizAdvanceTimer);
    quizAdvanceTimer = setTimeout(function () {
      quizAdvanceTimer = null;
      nextQuiz();
    }, 1100);
  }

  function nextQuiz() {
    quizIndex++;
    if (quizIndex >= quizQueue.length) {
      go('quizResult');
      return;
    }
    prepQuizQuestion();
    render();
  }

  function flipCard() {
    flipped = !flipped;
    render();
  }

  function togglePinyin() {
    if (flipped) return;
    pinyinShown = !pinyinShown;
    render();
  }

  function nextCard(mark) {
    if (mark !== undefined) {
      var it = deck[cardIndex];
      setMastered(currentLevel, it.idx, mark);
      stampAnim = mark ? 'know' : 'unknow';
    }
    if (cardIndex < deck.length - 1) {
      cardIndex++;
      flipped = false;
      pinyinShown = false;
      render();
      setTimeout(function () { stampAnim = null; render(); }, 550);
    } else {
      stampAnim = null;
      go('level');
    }
  }

  function prevCard() {
    if (cardIndex > 0) {
      cardIndex--;
      flipped = false;
      pinyinShown = false;
      render();
    }
  }

  function openList(level) {
    currentLevel = level;
    listSearch = '';
    view = 'list';
    render();
    window.scrollTo(0, 0);
  }

  function startListen(mode) {
    filterMode = mode;
    listenDeck = buildDeck(currentLevel, mode);
    listenIndex = 0;
    if (listenDeck.length === 0) { go('level'); return; }
    listenPlaying = true;
    view = 'listen';
    render();
    window.scrollTo(0, 0);
    playCurrentListen();
  }

  function playCurrentListen() {
    if (!listenPlaying) return;
    var row = listenDeck[listenIndex].row;
    speakWordThenMeaning(row, function () {
      if (!listenPlaying) return;
      setTimeout(function () {
        if (!listenPlaying) return;
        if (listenIndex < listenDeck.length - 1) {
          listenIndex++;
          render();
          playCurrentListen();
        } else {
          listenPlaying = false;
          render();
        }
      }, 900);
    });
  }

  function toggleListenPlay() {
    if (listenPlaying) {
      listenPlaying = false;
      stopSpeech();
      render();
    } else {
      listenPlaying = true;
      render();
      playCurrentListen();
    }
  }

  function listenSkip(dir) {
    stopSpeech();
    listenIndex = Math.max(0, Math.min(listenDeck.length - 1, listenIndex + dir));
    render();
    if (listenPlaying) playCurrentListen();
  }

  // ---------- render helpers ----------
  function el(tag, attrs, children) {
    var e = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function (k) {
      if (k === 'class') e.className = attrs[k];
      else if (k === 'html') e.innerHTML = attrs[k];
      else if (k.indexOf('on') === 0) e.addEventListener(k.slice(2), attrs[k]);
      else if (k === 'disabled') { e.disabled = !!attrs[k]; }
      else e.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) {
      if (c === null || c === undefined) return;
      if (typeof c === 'string') e.appendChild(document.createTextNode(c));
      else e.appendChild(c);
    });
    return e;
  }

  function levelShort(level) {
    return level.replace('HSK ', '').replace('급', '');
  }

  function renderHome() {
    var wrap = el('div', { class: 'screen home' });
    wrap.appendChild(el('div', { class: 'hero' }, [
      el('div', { class: 'hero-seal' }, ['漢']),
      el('h1', {}, ['HSK 단어장']),
      el('p', { class: 'sub' }, ['외운 단어 ' + LEVELS.reduce(function(s,l){return s+masteredCount(l);},0) + ' / ' + LEVELS.reduce(function(s,l){return s+DATA[l].length;},0)])
    ]));
    var list = el('div', { class: 'level-list' });
    LEVELS.forEach(function (level) {
      var total = DATA[level].length;
      var done = masteredCount(level);
      var pct = total ? Math.round((done / total) * 100) : 0;
      var card = el('button', { class: 'level-card', onclick: function () { openLevel(level); } }, [
        el('div', { class: 'stamp' }, [levelShort(level)]),
        el('div', { class: 'level-info' }, [
          el('div', { class: 'level-title' }, [level]),
          el('div', { class: 'level-meta' }, [done + ' / ' + total + ' 암기']),
          el('div', { class: 'bar' }, [el('div', { class: 'bar-fill', style: 'width:' + pct + '%' }, [])])
        ]),
        el('div', { class: 'chevron' }, ['›'])
      ]);
      list.appendChild(card);
    });
    wrap.appendChild(list);
    return wrap;
  }

  function renderLevel() {
    var level = currentLevel;
    var total = DATA[level].length;
    var done = masteredCount(level);
    var wrap = el('div', { class: 'screen' });
    wrap.appendChild(el('div', { class: 'topbar' }, [
      el('button', { class: 'back', onclick: function () { go('home'); } }, ['‹ 목록']),
      el('div', { class: 'topbar-title' }, [level])
    ]));
    wrap.appendChild(el('div', { class: 'level-summary' }, [
      el('div', { class: 'level-summary-num' }, [String(done)]),
      el('div', { class: 'level-summary-total' }, [' / ' + total + ' 암기 완료'])
    ]));

    var modeSection = el('div', { class: 'mode-section' });
    modeSection.appendChild(el('div', { class: 'section-label' }, ['학습 범위']));
    var scopeRow = el('div', { class: 'scope-row' }, [
      el('button', { class: 'scope-btn' + (filterMode === 'all' ? ' active' : ''), onclick: function () { filterMode = 'all'; render(); } }, ['전체 (' + total + ')']),
      el('button', { class: 'scope-btn' + (filterMode === 'unmastered' ? ' active' : ''), onclick: function () { filterMode = 'unmastered'; render(); } }, ['모르는 단어 (' + (total - done) + ')'])
    ]);
    modeSection.appendChild(scopeRow);

    modeSection.appendChild(el('div', { class: 'section-label' }, ['학습 방식']));
    var actions = el('div', { class: 'action-row' }, [
      el('button', { class: 'action-btn primary', onclick: function () { startFlashcards(filterMode); } }, [
        el('div', { class: 'action-icon' }, ['🀄']),
        el('div', {}, ['플래시카드'])
      ]),
      el('button', { class: 'action-btn', onclick: function () { startQuiz(filterMode); } }, [
        el('div', { class: 'action-icon' }, ['✎']),
        el('div', {}, ['퀴즈 (최대 20문제)'])
      ]),
      el('button', { class: 'action-btn', onclick: function () { startListen(filterMode); } }, [
        el('div', { class: 'action-icon' }, ['🔊']),
        el('div', {}, ['듣기 모드 (출근길용)'])
      ]),
      el('button', { class: 'action-btn', onclick: function () { openList(level); } }, [
        el('div', { class: 'action-icon' }, ['📋']),
        el('div', {}, ['단어 목록 (엑셀형 보기)'])
      ])
    ]);
    modeSection.appendChild(actions);
    wrap.appendChild(modeSection);
    if (!speechOK) {
      wrap.appendChild(el('div', { class: 'notice' }, ['이 브라우저는 음성 읽기(TTS)를 지원하지 않아요. 듣기 모드 대신 최신 크롬/사파리를 사용해보세요.']));
    } else if (!hasZhVoice()) {
      wrap.appendChild(el('div', { class: 'notice' }, ['이 기기에는 중국어 음성이 설치되어 있지 않아 소리가 안 나올 수 있어요. 설정 앱에서 "중국어(간체) 음성"을 추가해보세요 (아이폰: 손쉬운 사용 → 음성 콘텐츠 → 음성, 안드로이드: 설정 → 접근성 → 텍스트 음성 변환).']));
    }
    return wrap;
  }

  function renderFlashcards() {
    var level = currentLevel;
    var it = deck[cardIndex];
    var row = it.row;
    var wrap = el('div', { class: 'screen' });
    wrap.appendChild(el('div', { class: 'topbar' }, [
      el('button', { class: 'back', onclick: function () { go('level'); } }, ['‹ 나가기']),
      el('div', { class: 'topbar-title' }, [(cardIndex + 1) + ' / ' + deck.length])
    ]));

    var cardWrap = el('div', { class: 'card-area' });
    var cardEl = el('div', { class: 'flashcard' + (flipped ? ' flipped' : ''), onclick: togglePinyin }, [
      el('div', { class: 'card-face card-front' }, [
        el('div', { class: 'hanzi' }, [row['단어']]),
        pinyinShown ? el('div', { class: 'pinyin' }, [row['병음']]) : null,
        el('div', { class: 'tap-hint' }, [pinyinShown ? '좌우로 스와이프해 뜻 보기' : '탭하여 병음 보기'])
      ]),
      el('div', { class: 'card-face card-back' }, [
        row['품사'] ? el('div', { class: 'pos-tag' }, [row['품사']]) : null,
        el('div', { class: 'meaning' }, [row['뜻']]),
        row['예문'] ? el('div', { class: 'example' }, row['예문'].split('\n').map(function(line){ return el('div', {}, [line]); })) : null
      ])
    ]);
    if (stampAnim) {
      cardEl.appendChild(el('div', { class: 'stamp-mark ' + stampAnim }, [stampAnim === 'know' ? '熟' : '?']));
    }
    cardWrap.appendChild(cardEl);
    cardWrap.appendChild(el('button', {
      class: 'speaker-btn',
      onclick: function (e) { e.stopPropagation(); speakWordOnly(row); }
    }, ['🔊']));
    wrap.appendChild(cardWrap);

    wrap.appendChild(el('div', { class: 'nav-row' }, [
      el('button', { class: 'nav-btn', onclick: prevCard, disabled: cardIndex === 0 }, ['← 이전']),
      el('button', { class: 'nav-btn', onclick: function(){ nextCard(); } }, ['다음 →'])
    ]));

    wrap.appendChild(el('div', { class: 'mark-row' }, [
      el('button', { class: 'mark-btn unknow', onclick: function () { nextCard(false); } }, ['✗ 모르겠어요']),
      el('button', { class: 'mark-btn know', onclick: function () { nextCard(true); } }, ['✓ 외웠어요'])
    ]));
    return wrap;
  }

  function renderQuiz() {
    var wrap = el('div', { class: 'screen' });
    wrap.appendChild(el('div', { class: 'topbar' }, [
      el('button', { class: 'back', onclick: function () { go('level'); } }, ['‹ 나가기']),
      el('div', { class: 'topbar-title' }, [(quizIndex + 1) + ' / ' + quizQueue.length + '  ·  ' + quizScore + '점'])
    ]));
    var q = quizQueue[quizIndex].row;
    if (quizDirection === 'zh2en') {
      wrap.appendChild(el('div', { class: 'quiz-q' }, [
        el('div', { class: 'quiz-hanzi' }, [q['단어']]),
        el('div', { class: 'quiz-pinyin' }, [q['병음']])
      ]));
    } else {
      wrap.appendChild(el('div', { class: 'quiz-q' }, [
        el('div', { class: 'quiz-meaning-q' }, [q['뜻']])
      ]));
    }
    var choicesWrap = el('div', { class: 'quiz-choices' });
    quizChoices.forEach(function (c, i) {
      var cls = 'quiz-choice';
      if (quizAnswered) {
        if (c.idx === quizQueue[quizIndex].idx) cls += ' correct';
        else if (i === quizSelected) cls += ' wrong';
      }
      var content;
      if (quizDirection === 'zh2en') {
        content = [c.row['뜻']];
      } else {
        content = [
          el('span', { class: 'choice-hanzi' }, [c.row['단어']]),
          el('span', { class: 'choice-pinyin' }, [c.row['병음']])
        ];
      }
      choicesWrap.appendChild(el('button', { class: cls, onclick: function () { answerQuiz(i); } }, content));
    });
    wrap.appendChild(choicesWrap);
    return wrap;
  }

  function renderQuizResult() {
    var level = currentLevel;
    var wrap = el('div', { class: 'screen' });
    wrap.appendChild(el('div', { class: 'topbar' }, [
      el('button', { class: 'back', onclick: function () { go('level'); } }, ['‹ 나가기']),
      el('div', { class: 'topbar-title' }, ['퀴즈 결과'])
    ]));
    var total = quizScore + quizWrong.length;
    wrap.appendChild(el('div', { class: 'result-box' }, [
      el('div', { class: 'result-seal' }, [Math.round((quizScore/total)*100) + '%']),
      el('div', { class: 'result-text' }, [quizScore + ' / ' + total + ' 맞았어요'])
    ]));
    var actions = el('div', { class: 'action-row' });
    if (quizWrong.length > 0) {
      actions.appendChild(el('button', { class: 'action-btn primary', onclick: retryWrong }, [el('div',{},['✎']), el('div',{},['틀린 단어 다시 풀기 (' + quizWrong.length + ')'])]));
    }
    actions.appendChild(el('button', { class: 'action-btn', onclick: function () { go('level'); } }, [el('div',{},['🀄']), el('div',{},['레벨로 돌아가기'])]));
    wrap.appendChild(actions);

    wrap.appendChild(el('div', { class: 'section-label' }, ['이번 퀴즈에 나온 단어 — 암기 표시는 직접 선택하세요']));
    wrap.appendChild(el('div', { class: 'list-head' }, [
      el('div', { class: 'col-idx' }, ['#']),
      el('div', { class: 'col-word' }, ['단어']),
      el('div', { class: 'col-pinyin' }, ['병음']),
      el('div', { class: 'col-meaning' }, ['뜻']),
      el('div', { class: 'col-check' }, ['암기']),
    ]));
    var rowsHost = el('div', { class: 'list-rows result-rows' });
    wrap.appendChild(rowsHost);
    renderQuizResultRows(rowsHost, level);
    return wrap;
  }

  function renderQuizResultRows(host, level) {
    host.innerHTML = '';
    var frag = document.createDocumentFragment();
    quizQueue.forEach(function (it) {
      var idx = it.idx;
      var row = it.row;
      var mastered = isMastered(level, idx);
      frag.appendChild(el('div', { class: 'list-row' + (mastered ? ' mastered' : '') }, [
        el('div', { class: 'col-idx' }, [String(idx + 1)]),
        el('button', { class: 'col-word speak-word', onclick: function () { speakWordThenMeaning(row); } }, [row['단어']]),
        el('div', { class: 'col-pinyin' }, [row['병음']]),
        el('div', { class: 'col-meaning' }, [row['뜻']]),
        el('button', {
          class: 'col-check' + (mastered ? ' checked' : ''),
          onclick: function () { setMastered(level, idx, !mastered); renderQuizResultRows(host, level); }
        }, [mastered ? '✓' : '○'])
      ]));
    });
    host.appendChild(frag);
  }

  function renderList() {
    var level = currentLevel;
    var wrap = el('div', { class: 'screen' });
    wrap.appendChild(el('div', { class: 'topbar' }, [
      el('button', { class: 'back', onclick: function () { go('level'); } }, ['‹ 나가기']),
      el('div', { class: 'topbar-title' }, [level + ' 목록'])
    ]));
    wrap.appendChild(el('input', {
      class: 'search-box',
      type: 'text',
      placeholder: '단어, 병음, 뜻 검색...',
      value: listSearch,
      oninput: function (e) { listSearch = e.target.value; renderListRows(rowsHost, level); }
    }, []));

    var head = el('div', { class: 'list-head' }, [
      el('div', { class: 'col-idx' }, ['#']),
      el('div', { class: 'col-word' }, ['단어 (탭=듣기)']),
      el('div', { class: 'col-pinyin' }, ['병음']),
      el('div', { class: 'col-meaning' }, ['뜻']),
      el('div', { class: 'col-check' }, ['암기']),
    ]);
    wrap.appendChild(head);

    var rowsHost = el('div', { class: 'list-rows' });
    wrap.appendChild(rowsHost);
    renderListRows(rowsHost, level);
    return wrap;
  }

  function renderListRows(host, level) {
    host.innerHTML = '';
    var q = listSearch.trim().toLowerCase();
    var frag = document.createDocumentFragment();
    var shown = 0;
    DATA[level].forEach(function (row, idx) {
      if (q) {
        var hay = ((row['단어'] || '') + ' ' + (row['병음'] || '') + ' ' + (row['뜻'] || '')).toLowerCase();
        if (hay.indexOf(q) === -1) return;
      }
      shown++;
      var mastered = isMastered(level, idx);
      var r = el('div', { class: 'list-row' + (mastered ? ' mastered' : '') }, [
        el('div', { class: 'col-idx' }, [String(idx + 1)]),
        el('button', { class: 'col-word speak-word', onclick: function () { speakWordThenMeaning(row); } }, [row['단어']]),
        el('div', { class: 'col-pinyin' }, [row['병음']]),
        el('div', { class: 'col-meaning' }, [row['뜻']]),
        el('button', {
          class: 'col-check' + (mastered ? ' checked' : ''),
          onclick: function () { setMastered(level, idx, !mastered); renderListRows(host, level); }
        }, [mastered ? '✓' : '○'])
      ]);
      frag.appendChild(r);
    });
    if (shown === 0) {
      frag.appendChild(el('div', { class: 'list-empty' }, ['검색 결과가 없어요.']));
    }
    host.appendChild(frag);
  }

  function renderListen() {
    var level = currentLevel;
    var it = listenDeck[listenIndex];
    var row = it.row;
    var wrap = el('div', { class: 'screen' });
    wrap.appendChild(el('div', { class: 'topbar' }, [
      el('button', { class: 'back', onclick: function () { go('level'); } }, ['‹ 나가기']),
      el('div', { class: 'topbar-title' }, [(listenIndex + 1) + ' / ' + listenDeck.length])
    ]));
    wrap.appendChild(el('div', { class: 'listen-box' }, [
      el('div', { class: 'listen-badge' }, [listenPlaying ? '🔊 재생 중' : '⏸ 일시정지']),
      el('div', { class: 'hanzi' }, [row['단어']]),
      el('div', { class: 'pinyin' }, [row['병음']]),
      el('div', { class: 'meaning listen-meaning' }, [row['뜻']])
    ]));
    wrap.appendChild(el('div', { class: 'nav-row' }, [
      el('button', { class: 'nav-btn', onclick: function () { listenSkip(-1); }, disabled: listenIndex === 0 }, ['← 이전']),
      el('button', { class: 'nav-btn', onclick: function () { listenSkip(1); }, disabled: listenIndex === listenDeck.length - 1 }, ['다음 →'])
    ]));
    wrap.appendChild(el('button', { class: 'nav-btn full', onclick: toggleListenPlay }, [listenPlaying ? '⏸ 일시정지' : '▶ 재생']));
    wrap.appendChild(el('div', { class: 'notice' }, ['화면을 끄거나 다른 앱으로 전환하면 재생이 멈출 수 있어요. 이 탭을 켜둔 채로 들어주세요.']));
    return wrap;
  }

  function render() {
    root.innerHTML = '';
    var screen;
    if (view === 'home') screen = renderHome();
    else if (view === 'level') screen = renderLevel();
    else if (view === 'flashcards') screen = renderFlashcards();
    else if (view === 'quiz') screen = renderQuiz();
    else if (view === 'quizResult') screen = renderQuizResult();
    else if (view === 'list') screen = renderList();
    else if (view === 'listen') screen = renderListen();
    root.appendChild(screen);
  }

  // swipe support for flashcards: swipe left/right flips the card to the back
  var touchStartX = null;
  document.addEventListener('touchstart', function (e) {
    if (view !== 'flashcards') return;
    touchStartX = e.touches[0].clientX;
  }, { passive: true });
  document.addEventListener('touchend', function (e) {
    if (view !== 'flashcards' || touchStartX === null) return;
    var dx = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(dx) > 60) {
      flipCard();
    }
    touchStartX = null;
  }, { passive: true });

  loadProgress();
  render();
})();

</script>
</body>
</html>
